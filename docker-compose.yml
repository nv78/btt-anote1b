services:
  backend:
    build: ./backend
    environment:
      PORT: 5001
      FLASK_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      SQLITE_DB_PATH: /data/leaderboard.db
    ports:
      - "5001:5001"
    volumes:
      - leaderboard_data:/data

  frontend:
    build: ./frontend
    environment:
      REACT_APP_API_BASE: http://localhost:5001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  leaderboard_data:
