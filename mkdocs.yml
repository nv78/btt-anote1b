site_name: Anote Leaderboard
site_description: Local and API documentation for the Anote model leaderboard.
site_url: https://leaderboard.anote.ai/docs
docs_dir: docs
site_dir: site
use_directory_urls: false
repo_url: https://github.com/anote-ai/Leaderboard

theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotation
    - navigation.instant
    - navigation.sections
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: black
      accent: light blue
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: black
      accent: lime
nav:
  - Home: index.md
  - Running Locally: running-locally.md
  - API Usage: api.md
  - Hugging Face Imports: huggingface-imports.md
  - Operations: operations.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - tables

plugins:
  - search

extra:
  homepage: https://anote.ai
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/anote-ai/
